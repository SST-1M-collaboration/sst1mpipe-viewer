# Statistics accumulated by the "DL3" page, for all the observations (same format as
# dl1_statistics.yaml).
#
# The columns are those of the EVENTS table of the DL3 files (GADF format), in lower case:
# energy (TeV), ra, dec, detx, dety (deg), and the columns added by the viewer (sst1mpipe_viewer.dl3):
# theta2 (deg^2, squared angular distance to the target of the observation) and
# offset_lon, offset_lat (deg, position relative to the target).

hist1d:
  - {column: energy, log_x: true, range: [0.1, 1000], bins: 40, unit: TeV, title: "energy", log_y: true}
  - {column: theta2, range: [0, 0.5], bins: 50, unit: "deg^2", title: "theta^2 to the target"}

hist2d:
  - {x: offset_lon, x_range: [-3, 3], x_bins: 60, y: offset_lat, y_range: [-3, 3], y_bins: 60, name: sky, title: "Sky map: offset from the target (deg)"}
  - {x: detx, x_range: [-5, 5], x_bins: 50, y: dety, y_range: [-5, 5], y_bins: 50, name: field_of_view, title: "Position in the field of view (DETX / DETY, deg)"}
